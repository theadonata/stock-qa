[project]
name = "stock-qa-api-tests"
version = "0.1.0"
description = "pytest + httpx API tests that exercise a running stock-backend instance as a black box."
requires-python = ">=3.11"
dependencies = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
# Keep tests discoverable only under this tests/ directory, and fail loudly
# on unknown markers so typos in @pytest.mark.xxx don't silently no-op.
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "smoke: minimal tests that verify a stock-backend instance is reachable and responding",
]
